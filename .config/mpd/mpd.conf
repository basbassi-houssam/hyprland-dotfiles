# Required for MPD to run without root.
user "kaede"

# >>> CHANGE THIS PATH TO YOUR MUSIC FOLDER <<<
music_directory    "~/Music"

# MPD will create these files automatically.
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/tag_cache"
log_file           "~/.config/mpd/mpd.log"
pid_file           "~/.config/mpd/pid"

# Network settings for ncmpcpp to connect to.
bind_to_address    "127.0.0.1"
port               "6600"

# Audio Output (for a typical PipeWire/PulseAudio setup on Hyprland).
audio_output {
    type            "pipewire"
    name            "My PipeWire Output"
}
