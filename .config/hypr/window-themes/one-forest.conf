#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(98971aff) rgba(4f4f13ff) 45deg
    col.inactive_border = rgba(3c3836aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1d2021ee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 3

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutCirc,    0,    0.55, 0.45, 1
    bezier = easeInOutExpo,  0.87, 0,    0.13, 1
    bezier = easeOutBack,    0.34, 1.56, 0.64, 1
    bezier = smoothStep,     0.42, 0,    0.58, 1

    # Updated animations with smoother curves
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     8,     smoothStep
    animation = border,        1,     4,     easeOutCirc
    animation = windows,       1,     5,     easeOutCirc
    animation = windowsIn,     1,     5,     easeOutCirc, popin 80%
    animation = windowsOut,    1,     2.5,   easeInOutExpo, popin 80%
    animation = fadeIn,        1,     2,     easeOutCirc
    animation = fadeOut,       1,     2,     easeInOutExpo
    animation = fade,          1,     3,     smoothStep
    animation = layers,        1,     4,     easeOutCirc
    animation = layersIn,      1,     4,     easeOutCirc, fade
    animation = layersOut,     1,     2,     easeInOutExpo, fade
    animation = fadeLayersIn,  1,     2,     easeOutCirc
    animation = fadeLayersOut, 1,     2,     easeInOutExpo
    animation = workspaces,    1,     3,     easeOutBack, slide
    animation = workspacesIn,  1,     3,     easeOutBack, slide
    animation = workspacesOut, 1,     3,     easeOutBack, slide
    animation = zoomFactor,    1,     6,     smoothStep
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
