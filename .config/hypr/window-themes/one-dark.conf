#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(61afefff) rgba(4795d5ff) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 3

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # New bezier curves for different feel
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = bounce,         0.43, 1.62, 0.57, 1.25
    bezier = overshoot,      0.34, 1.56, 0.64, 1.02
    bezier = elastic,        0.68, -0.55, 0.27, 1.55
    bezier = slowReturn,     0.25, 0.1,   0.25, 1
    bezier = fastAccel,      0.7,  0,    0.84, 0

    # Completely new animation styles
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     6,     slowReturn
    animation = border,        1,     8,     bounce
    animation = windows,       1,     7,     overshoot
    animation = windowsIn,     1,     6,     bounce,      slide
    animation = windowsOut,    1,     3,     elastic,     slide
    animation = fadeIn,        1,     4,     slowReturn
    animation = fadeOut,       1,     2,     fastAccel
    animation = fade,          1,     5,     slowReturn
    animation = layers,        1,     6,     overshoot
    animation = layersIn,      1,     5,     bounce,      slide
    animation = layersOut,     1,     2.5,   elastic,     slide
    animation = fadeLayersIn,  1,     3,     slowReturn
    animation = fadeLayersOut, 1,     1.5,   fastAccel
    animation = workspaces,    1,     5,     bounce,      slidevert
    animation = workspacesIn,  1,     4,     bounce,      slidevert
    animation = workspacesOut, 1,     3,     elastic,     slidevert
    animation = zoomFactor,    1,     8,     overshoot
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
