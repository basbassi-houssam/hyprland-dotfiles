#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(ffffffff) rgba(454545ff) 45deg
    col.inactive_border = rgba(4a4a4aff)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 3

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Smooth, modern bezier curves
    bezier = overshot,       0.13, 0.99, 0.29, 1.1
    bezier = smoothOut,      0.25, 1,    0.5,  1
    bezier = smoothInOut,    0.37, 0,    0.63, 1
    bezier = bounce,         0.34, 1.56, 0.64, 1
    bezier = softFade,       0.4,  0,    0.2,  1

    # Fluid window animations
    animation = global,          1, 6,    smoothOut
    animation = border,          1, 4,    overshot
    animation = windows,         1, 5,    bounce,      slide
    animation = windowsIn,       1, 4.5,  bounce,      popin 80%
    animation = windowsOut,      1, 3,    smoothInOut, popin 80%
    animation = fadeIn,          1, 2.5,  softFade
    animation = fadeOut,         1, 2,    smoothOut
    animation = fade,            1, 3,    smoothInOut
    animation = layers,          1, 4,    smoothOut
    animation = layersIn,        1, 3.5,  smoothOut,   fade
    animation = layersOut,       1, 2.5,  smoothInOut, fade
    animation = fadeLayersIn,    1, 2,    softFade
    animation = fadeLayersOut,   1, 1.5,  smoothOut
    animation = workspaces,      1, 3.5,  smoothOut,    slidevert
    animation = workspacesIn,    1, 3,    smoothOut,    slidevert
    animation = workspacesOut,   1, 2.5,  smoothInOut,  slidevert
    animation = zoomFactor,      1, 5,    overshot
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
