###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Terminal bindings
bind = $mainMod, code:36, exec, $terminal                    # RETURN
bind = $mainMod ALT, code:36, exec, $floatingKitty          # ALT + RETURN

# Window management
bind = $mainMod, code:53, killactive,                       # X
bind = ALT, code:38, togglefloating,                        # A

# Power/monitor controls
bind = $mainMod CTRL_ALT, code:32, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit  # O
bind = $mainMod CTRL_ALT, code:27, exec, PowerControl reboot   # R
bind = $mainMod CTRL_ALT, code:33, exec, PowerControl poweroff # P
bind = $mainMod CTRL_ALT, code:46, exec, PowerControl lock     # L
bind = $mainMod CTRL_ALT, code:58, exec, Monitors              # M

# Applications
bind = $mainMod, code:41, exec, $fileManager                   # F
bind = $mainMod ALT, code:39, exec, ScreenShoter               # S
bind = $mainMod ALT, code:34, exec, $fetch                     # I
bind = $mainMod ALT, code:45, exec, $keylayout                 # K
bind = $mainMod, code:29, exec, $yazi                          # Y
bind = $mainMod, code:58, exec, $musicplayer                   # M
bind = $mainMod, code:33, exec, $colorpicker                   # P
bind = $mainMod, code:40, exec, discord                        # D
bind = $mainMod, code:56, exec, $browser                       # B

# Launchers and menus
bind = $mainMod, code:65, exec, $menu                          # SPACE
bind = ALT, code:65, exec, $themeselector                      # ALT + SPACE

# Hyprland commands
bind = $mainMod ALT, code:27, exec, Reload                     # R
bind = $mainMod, code:30, pseudo,                              # U (for dwindle)
bind = $mainMod, code:44, layoutmsg, togglesplit               # J

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

# Move active window to a workspace with mainMod + CTRL + [0-9]
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8

# Move active window to a workspace with mainMod + ALT + [0-9]
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

