$wall = $HOME/.config/hypr/hyprlock/wallpapers/arctic-monsoon-wallpaper.png
$weather = "$HOME/.config/waybar/bin/Weather wmodule"

background {
    monitor =
    path = $wall
    blur_passes = 1
    blur_size = 1
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}


input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(151515)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
}


label {
    monitor =
    #clock
    #text = cmd[update:1000] echo "$TIME", $LAYOUT[en,ara]
    text = cmd[update:1000] echo "<span foreground='##ffffff'>$(date "+%a %b %d %I:%M %p")</span>"
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = Fira Semibold
    position = -50, 65
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Weather div
shape {
    monitor =
    size = 140, 80
    color = rgb(255, 255, 255)
    rounding = 20
    rotate = 0
    position = -210, -220
    halign = left
    valign = top
    xray = false
    zindex = 1
}


# WEATHER 
label {
    monitor =
    text = cmd[update:1000] echo "$($weather)"
    color = rgb(173, 48, 49)
    font_size = 10
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = -220, -230
    halign = left
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:60000] echo "Good $(date +"%H" | awk '{if ($1 < 12) print "morning"; else if ($1 < 18) print "afternoon"; else if ($1 < 22) print "evening"; else print "night"}') $(echo ${USER} | tr '[:upper:]' '[:lower:]')"
    color = rgba(200, 200, 200, 1.0)
    font_size = 16
    font_family = Fira Semibold
    position = -70, 120
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

image {
    monitor =
    path =  ~/.config/hypr/assets/user.jpg
    size = 200 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 3
    border_color = rgb(221, 221, 221)
    rotate = 0 # degrees, counter-clockwise
    # reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 180
    halign = center
    valign = center
}
