<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <alias>
        <family>JetBrainsMono Nerd Font</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>DroidSansArabic</family>
        </prefer>
    </alias>
    <!-- Also apply to the generic 'monospace' family for terminals -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrainsMono Nerd Font</family>
            <family>DroidSansArabic</family>
        </prefer>
    </alias>
</fontconfig>
